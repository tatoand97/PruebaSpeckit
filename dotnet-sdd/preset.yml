schema_version: "1.0"

preset:
  id: "dotnet-sdd"
  name: ".NET SDD"
  version: "1.0.1"
  description: "Preset SDD reutilizable para monolitos modulares greenfield en .NET 10"
  author: "Contributors"

requires:
  speckit_version: ">=0.14.3"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Principios permanentes del preset para proyectos .NET"
      strategy: "replace"
      replaces: "constitution-template"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-addendum.md"
      description: "Secciones funcionales para NFR y necesidades de contrato"
      strategy: "append"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plan para monolito modular .NET con controles de arquitectura y DoD"
      strategy: "replace"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tareas ejecutables limitadas a la V1 y su DoD local"
      strategy: "replace"
      replaces: "tasks-template"

    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Protege la línea base del preset al actualizar la constitución"
      strategy: "append"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Añade validaciones del preset al flujo oficial de planificación"
      strategy: "append"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Limita el alcance y exige tareas que produzcan evidencia del DoD"
      strategy: "append"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Añade controles .NET, arquitectura, coverage y OpenAPI a la implementación"
      strategy: "append"

    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Amplía la evaluación oficial de convergencia con el estándar del preset"
      strategy: "append"

tags:
  - "dotnet"
  - "ddd"
  - "clean-architecture"
  - "enterprise"
  - "sdd"
