openapi: 3.0.3
info:
  title: Contact Requests API
  version: 1.0.0
  description: Contrato HTTP para registrar solicitudes de contacto.
  license:
    name: Proprietary
servers:
  - url: https://api.example.com
    description: Production placeholder
paths:
  /contact-requests:
    post:
      summary: Registrar solicitud de contacto
      operationId: registerContactRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterContactRequest'
      responses:
        '201':
          description: Solicitud registrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterContactResponse'
        '400':
          description: Error de validación
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Error inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    RegisterContactRequest:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        message:
          type: string
          minLength: 10
          maxLength: 1000
    RegisterContactResponse:
      type: object
      required:
        - id
        - createdAt
        - status
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - Pending
    ProblemDetails:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          nullable: true
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
