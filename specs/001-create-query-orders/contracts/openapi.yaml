openapi: 3.1.0
info:
  title: Orders PoC API
  version: 1.0.0
  description: |
    Contrato de dos capacidades de negocio representadas por tres operaciones HTTP:
    crear con POST /orders, consultar por ID con GET /orders/{orderId}, y rechazar
    explícitamente el ID ausente con GET /orders. GET /orders nunca enumera.

    No hay autenticación ni rate limiting. La API sólo se soporta en loopback o red
    de desarrollo aislada, con datos sintéticos/no sensibles y sin exposición pública.

    Todos los errores producidos por la aplicación usan application/problem+json.
    Rechazos del host o red anteriores/fuera del pipeline controlado —incluidos 413,
    405, malformed HTTP, timeouts y desconexiones— no garantizan Problem Details.
  x-controlled-environment:
    publicInternet: prohibited
    data: synthetic-or-preclassified-non-sensitive
    authentication: none
    rateLimiting: none
  x-http-boundary-errors:
    - status: 405
      problemDetailsGuaranteed: false
    - condition: server-timeout-or-disconnect
      problemDetailsGuaranteed: false
servers:
  - url: http://127.0.0.1:5080
    description: Loopback local reproducible; HTTP sin TLS sólo se admite en loopback.
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Crear una orden
      description: |
        Cada request válida crea una orden independiente. La validación semántica
        acumula todas las reglas detectables después de una deserialización correcta.
        No hay idempotency key: un retry después de timeout, desconexión o resultado
        incierto puede crear otra orden.

        Kestrel limita el body a 1.048.576 bytes. El límite es operativo, no de
        negocio, y nunca trunca. Un 201 sólo se produce después del commit. Todo 503
        de esta operación garantiza que no hubo commit.
      x-max-request-body-bytes: 1048576
      x-idempotency: deliberately-not-supported
      requestBody:
        required: true
        description: |
          Se exige Content-Type application/json (parámetros como charset son
          permitidos). Su ausencia produce 415 antes de leer el body, incluso si el
          body también falta. Con Content-Type correcto, body ausente/vacío/null,
          JSON malformado, tipos incorrectos, propiedades repetidas y números no
          representables como Int64 dan 400. Propiedades desconocidas se ignoran y
          no se almacenan.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              valid:
                value:
                  customerId: customer-001
                  items:
                    - productId: product-A
                      quantity: 2
                    - productId: product-B
                      quantity: 1
              duplicateProduct:
                value:
                  customerId: customer-001
                  items:
                    - productId: product-A
                      quantity: 1
                    - productId: product-A
                      quantity: 2
      responses:
        '201':
          description: Orden completa confirmada por commit.
          headers:
            Location:
              required: true
              description: Ruta relativa canónica para consultar la orden.
              schema:
                type: string
                pattern: '^/orders/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
                example: /orders/0f8fad5b-d9cb-469f-a165-70867728950e
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              example:
                orderId: 0f8fad5b-d9cb-469f-a165-70867728950e
                status: Pending
        '400':
          description: Body no interpretable o una/más reglas semánticas incumplidas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                multipleSemanticErrors:
                  value:
                    type: urn:orders:problem:validation
                    title: La solicitud no es válida.
                    status: 400
                    detail: Se detectaron errores de validación semántica.
                    instance: /orders
                    traceId: 00-f067aa0ba902b7-1b08e6c8f05f13-00
                    errors:
                      customerId:
                        - Debe contener al menos un carácter distinto de espacio.
                      items[0].quantity:
                        - Debe ser un entero mayor que cero.
                duplicateProduct:
                  value:
                    type: urn:orders:problem:validation
                    title: La solicitud no es válida.
                    status: 400
                    detail: Se detectaron errores de validación semántica.
                    instance: /orders
                    traceId: 00-f067aa0ba902b7-1b08e6c8f05f13-00
                    errors:
                      items[1].productId:
                        - Duplica el identificador del elemento en el índice 0.
                malformedBody:
                  value:
                    type: urn:orders:problem:invalid-body
                    title: El cuerpo JSON no es válido.
                    status: 400
                    detail: El body debe ser un objeto JSON válido con los tipos declarados.
                    instance: /orders
                    traceId: 00-f067aa0ba902b7-1b08e6c8f05f13-00
                    errors:
                      body:
                        - No fue posible interpretar el cuerpo.
        '413':
          description: |
            Body superior a 1.048.576 bytes. Kestrel puede rechazar por
            Content-Length o al contar un stream/chunked; Content-Length ausente no
            elimina el límite y uno inconsistente es error de protocolo del host.
            Puede ocurrir antes del endpoint, por lo que no se garantiza media type,
            schema ni Problem Details. No se crea ninguna orden ni hay truncamiento.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            Indisponibilidad temporal pre-commit: gate no adquirido en 1 segundo,
            SQLite busy/locked tras 500 ms, o storage temporalmente no disponible
            con no-commit probado. No incluye Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:orders:problem:temporarily-unavailable
                title: Servicio temporalmente no disponible.
                status: 503
                detail: La operación no pudo completarse temporalmente.
                instance: /orders
                traceId: 00-f067aa0ba902b7-1b08e6c8f05f13-00
    get:
      operationId: rejectMissingOrderId
      summary: Rechazar consulta sin identificador
      description: |
        Representa exclusivamente la ausencia de orderId. Nunca lista, filtra,
        busca ni devuelve órdenes.
      responses:
        '400':
          description: Falta el identificador de orden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              example:
                type: urn:orders:problem:missing-order-id
                title: Falta el identificador de orden.
                status: 400
                detail: Use la ruta Location devuelta al crear la orden.
                instance: /orders
                traceId: 00-f067aa0ba902b7-1b08e6c8f05f13-00
                errors:
                  orderId:
                    - Debe proporcionar el identificador exacto de la orden.
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Consultar una orden por identificador exacto
      description: |
        La operación soportada usa la ruta Location devuelta por POST. El route
        value que alcance el handler se compara de forma ordinal/binaria. Blanco
        produce 400; no blanco sin coincidencia produce 404. Un 404 anterior al
        commit de una creación concurrente no impide que esa creación se confirme
        después. Ninguna lectura observa una orden parcial.

        Slash codificado, encoding inválido, segmentos extra u otras formas que el
        host/router no asigne a este handler están fuera del contrato Problem Details.
      parameters:
        - name: orderId
          in: path
          required: true
          description: |
            UUID v4 canónico de Location. Otros valores no-whitespace que lleguen al
            handler son opacos y normalmente producen 404; no se normalizan.
          schema:
            type: string
          examples:
            generated:
              value: 0f8fad5b-d9cb-469f-a165-70867728950e
            nonMatchingOpaqueValue:
              value: not-a-generated-id
      responses:
        '200':
          description: Orden completa encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                orderId: 0f8fad5b-d9cb-469f-a165-70867728950e
                customerId: customer-001
                items:
                  - productId: product-A
                    quantity: 2
                  - productId: product-B
                    quantity: 1
                status: Pending
        '400':
          description: Route value vacío/blanco que alcanzó la operación.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              example:
                type: urn:orders:problem:validation
                title: La solicitud no es válida.
                status: 400
                detail: Se detectaron errores de validación semántica.
                instance: /orders/{orderId}
                traceId: 00-f067aa0ba902b7-1b08e6c8f05f13-00
                errors:
                  orderId:
                    - Debe contener al menos un carácter distinto de espacio.
        '404':
          description: No existe coincidencia binaria para el route value utilizable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:orders:problem:not-found
                title: Orden no encontrada.
                status: 404
                detail: No existe una orden asociada al identificador proporcionado.
                instance: /orders/{orderId}
                traceId: 00-f067aa0ba902b7-1b08e6c8f05f13-00
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Storage temporalmente no disponible para lectura.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:orders:problem:temporarily-unavailable
                title: Servicio temporalmente no disponible.
                status: 503
                detail: La operación no pudo completarse temporalmente.
                instance: /orders/{orderId}
                traceId: 00-f067aa0ba902b7-1b08e6c8f05f13-00
components:
  responses:
    UnsupportedMediaType:
      description: Content-Type ausente o distinto de application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:orders:problem:unsupported-media-type
            title: Content-Type no soportado.
            status: 415
            detail: Use application/json.
            instance: /orders
            traceId: 00-f067aa0ba902b7-1b08e6c8f05f13-00
    InternalError:
      description: |
        Fallo permanente, inesperado o de invariant. Detalles internos, IDs, SQL,
        paths y stack traces no se exponen.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - customerId
        - items
      additionalProperties: true
      x-unknown-properties: ignored
      x-duplicate-json-properties: rejected
      properties:
        customerId:
          type: string
          description: |
            Identificador opaco. Debe contener al menos un carácter no-whitespace;
            se acepta aunque sea desconocido y se conserva sin alteración.
        items:
          type: array
          minItems: 1
          description: |
            No existe máximo de negocio. El body HTTP completo sí está limitado a
            1 MiB. productId es único por comparación ordinal exacta.
          items:
            $ref: '#/components/schemas/OrderItemInput'
    OrderItemInput:
      type: object
      required:
        - productId
        - quantity
      additionalProperties: true
      x-unknown-properties: ignored
      x-duplicate-json-properties: rejected
      properties:
        productId:
          type: string
          description: |
            Al menos un carácter no-whitespace; no se consulta catálogo ni se
            aplica trim, case-fold o normalización.
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: |
            Token JSON entero decimal entre 1 y 9223372036854775807. Aunque JSON
            Schema considere matemáticamente integrales algunos números con .0 o
            exponente, este contrato los rechaza por el binding Int64 estricto.
          x-json-lexical-form: integer-token-without-fraction-or-exponent
    CreateOrderResponse:
      type: object
      required:
        - orderId
        - status
      additionalProperties: false
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        status:
          $ref: '#/components/schemas/OrderStatus'
    OrderResponse:
      type: object
      required:
        - orderId
        - customerId
        - items
        - status
      additionalProperties: false
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        customerId:
          type: string
        items:
          type: array
          minItems: 1
          description: |
            Contiene todos los items confirmados. La posición/orden no tiene
            semántica ni estabilidad contractual.
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          $ref: '#/components/schemas/OrderStatus'
    OrderItem:
      type: object
      required:
        - productId
        - quantity
      additionalProperties: false
      properties:
        productId:
          type: string
        quantity:
          type: integer
          format: int64
          minimum: 1
    OrderId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: UUID v4 canónico `D`, lower-case y opaco.
    OrderStatus:
      type: string
      enum:
        - Pending
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - traceId
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - urn:orders:problem:not-found
            - urn:orders:problem:unsupported-media-type
            - urn:orders:problem:internal
            - urn:orders:problem:temporarily-unavailable
        title:
          type: string
        status:
          type: integer
          enum:
            - 404
            - 415
            - 500
            - 503
        detail:
          type: string
        instance:
          type: string
          enum:
            - /orders
            - /orders/{orderId}
          description: Logical route template; never raw input.
        traceId:
          type: string
          description: Correlates exactly with the safe structured application event.
    ValidationProblem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - traceId
        - errors
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - urn:orders:problem:invalid-body
            - urn:orders:problem:validation
            - urn:orders:problem:missing-order-id
        title:
          type: string
        status:
          type: integer
          const: 400
        detail:
          type: string
        instance:
          type: string
          enum:
            - /orders
            - /orders/{orderId}
          description: Logical route template; never raw input.
        traceId:
          type: string
        errors:
          type: object
          minProperties: 1
          description: |
            Stable keys only: body, customerId, items, orderId, items[n],
            items[n].productId, items[n].quantity.
          propertyNames:
            pattern: '^(body|customerId|items|orderId|items\[[0-9]+\](\.productId|\.quantity)?)$'
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
