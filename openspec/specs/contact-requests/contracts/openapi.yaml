openapi: 3.0.3
info:
  title: Contact Requests API
  version: 1.0.0
  description: Active HTTP contract for registering contact requests.
servers:
  - url: /
    description: Current application host
paths:
  /contact-requests:
    post:
      summary: Register a contact request
      operationId: registerContactRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterContactRequest'
      responses:
        '201':
          description: Contact request registered
          headers:
            Location:
              description: URI assigned to the created contact request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterContactResponse'
        '400':
          description: One or more fields failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    RegisterContactRequest:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
        email:
          type: string
          description: Exactly one at-sign, a non-empty local part, a dotted domain, and no space characters.
          pattern: '^[^@ ]+@[^@ ]+\.[^@ ]+$'
        message:
          type: string
          minLength: 10
          maxLength: 1000
          pattern: '\S'
    RegisterContactResponse:
      type: object
      required:
        - id
        - createdAt
        - status
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - Pending
    ProblemDetails:
      type: object
      required:
        - title
        - status
        - traceId
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        traceId:
          type: string
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - errors
            - traceId
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
