name: dotnet-sdd
version: 1
description: Governed OpenSpec workflow for modular-monolith .NET development

artifacts:
  - id: proposal
    generates: proposal.md
    description: Problem, scope, capabilities, compatibility, risks, and impact
    template: proposal.md
    instruction: |
      Explain why the change is needed and what observable capability is affected.
      Keep implementation details out. Declare new and modified capabilities using
      the exact kebab-case names that will be represented below specs/.
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: Native OpenSpec delta specifications for affected capabilities
    template: spec.md
    instruction: |
      Define WHAT the system must do, never HOW it is implemented. Preserve native
      OpenSpec delta semantics: ADDED, MODIFIED, REMOVED, and RENAMED Requirements.
      Every requirement must use SHALL or MUST and include at least one Scenario
      with exactly four heading markers and WHEN/THEN bullets.
    requires:
      - proposal

  - id: research
    generates: research.md
    description: Evidence-backed decisions and resolved technical uncertainty
    template: research.md
    instruction: |
      Record decisions, rationale, alternatives, official sources, resolved
      uncertainties, and relevant framework or library versions. Do not invent
      requirements or silently choose an unresolved product behavior.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design and validation strategy
    template: design.md
    instruction: |
      Explain HOW the approved requirements will be implemented under the project
      governance. Link optional supporting documents from design.md when needed;
      do not create ceremonial artifacts for changes that do not need them.
    requires:
      - research

  - id: review
    generates: review.md
    description: Pre-task cross-artifact and governance review
    template: review.md
    instruction: |
      Review proposal, specs, research, and design before tasks. Record every gap,
      conflict, pending clarification, and required Definition of Done evidence.
      A document's existence is not evidence that its decisions are complete.
    requires:
      - specs
      - design

  - id: tasks
    generates: tasks.md
    description: Ordered, executable, observable implementation work
    template: tasks.md
    instruction: |
      Produce dependency-ordered checkbox tasks with concrete repository paths,
      associated tests, verification commands, and observable completion criteria.
      Do not hide unresolved review findings in implementation assumptions.
    requires:
      - specs
      - design
      - review

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Follow tasks.md in dependency order and keep its checkboxes current. Validate
    after each coherent slice. Run the repository's explicit .NET SDD verification
    before claiming completion, and stop on unresolved requirements or gate failures.
