schema_version: "1.0"

workflow:
  id: "dotnet-sdd-feature"
  name: ".NET SDD Feature"
  version: "0.1.0"
  description: "Standard governed SDD workflow for .NET feature development using Spec Kit and dotnet-sdd."

requires:
  speckit_version: ">=0.14.3"
  integrations:
    any:
      - "copilot"
      - "codex"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the functional need for the feature"
  integration:
    type: string
    default: "copilot"
    enum:
      - "copilot"
      - "codex"
    prompt: "Integration used to execute Spec Kit commands"

steps:
  - id: "specify"
    type: command
    command: "speckit.specify"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "clarify"
    type: command
    command: "speckit.clarify"
    integration: "{{ inputs.integration }}"

  - id: "review-spec"
    type: gate
    message: "Revise spec.md, resuelva cualquier pregunta pendiente mostrada por speckit.clarify y confirme que la especificación representa correctamente la necesidad funcional antes de diseñar la solución."
    options:
      - "approve"
      - "reject"
    on_reject: abort

  - id: "plan"
    type: command
    command: "speckit.plan"
    integration: "{{ inputs.integration }}"

  - id: "checklist"
    type: command
    command: "speckit.checklist"
    integration: "{{ inputs.integration }}"

  - id: "review-plan"
    type: gate
    message: "Revise plan.md, research.md, data-model.md, contracts/ y checklists/ cuando existan. ¿El diseño técnico y sus contratos están suficientemente maduros para generar el trabajo ejecutable?"
    options:
      - "approve"
      - "reject"
    on_reject: abort

  - id: "tasks"
    type: command
    command: "speckit.tasks"
    integration: "{{ inputs.integration }}"

  - id: "analyze"
    type: command
    command: "speckit.analyze"
    integration: "{{ inputs.integration }}"

  - id: "review-readiness"
    type: gate
    message: "Apruebe solo si specification, plan y tasks son consistentes y están suficientemente maduros para permitir generación o modificación de código. Si analyze reportó hallazgos bloqueantes, NO apruebe este gate. Corrija los artefactos fuente y vuelva a ejecutar el workflow."
    options:
      - "approve"
      - "reject"
    on_reject: abort

  - id: "implement"
    type: command
    command: "speckit.implement"
    integration: "{{ inputs.integration }}"

  - id: "converge"
    type: command
    command: "speckit.converge"
    integration: "{{ inputs.integration }}"

  - id: "review-convergence"
    type: gate
    message: "Revise el resultado de speckit.converge. Si informó \"Converged\", apruebe para finalizar. Si agregó tareas, rechace para abortar este run, complete las nuevas tasks mediante el flujo correspondiente y ejecute nuevamente el workflow o el flujo de convergencia."
    options:
      - "approve"
      - "reject"
    on_reject: abort
