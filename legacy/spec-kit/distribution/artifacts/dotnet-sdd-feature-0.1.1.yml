schema_version: "1.0"

workflow:
  id: "dotnet-sdd-feature"
  name: ".NET SDD Feature"
  version: "0.1.1"
  description: "Standard governed SDD workflow for .NET feature development using Spec Kit and dotnet-sdd, with bounded automatic analysis."

requires:
  speckit_version: ">=0.14.3"
  integrations:
    any:
      - "copilot"
      - "codex"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the functional need for the feature"
  integration:
    type: string
    default: "copilot"
    enum:
      - "copilot"
      - "codex"
    prompt: "Integration used to execute Spec Kit commands"

steps:
  - id: "specify"
    type: command
    command: "speckit.specify"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "review-spec"
    type: gate
    message: "Revise spec.md, verifique scope y ambiguedades materiales, y no apruebe si existen preguntas funcionales relevantes. Use speckit.clarify manualmente cuando haga falta; si resuelve dudas en el mismo run pausado, apruebe este gate para continuar."
    options:
      - "approve"
      - "reject"
    on_reject: abort

  - id: "plan"
    type: command
    command: "speckit.plan"
    integration: "{{ inputs.integration }}"

  - id: "review-plan"
    type: gate
    message: "Revise plan.md, research.md, data-model.md y contracts/ cuando existan. Verifique que el diseño y sus contratos esten suficientemente maduros para generar trabajo ejecutable. speckit.checklist sigue disponible como herramienta manual opcional cuando el operador necesite una revision formal adicional."
    options:
      - "approve"
      - "reject"
    on_reject: abort

  - id: "tasks"
    type: command
    command: "speckit.tasks"
    integration: "{{ inputs.integration }}"

  - id: "analyze"
    type: command
    command: "speckit.analyze"
    integration: "{{ inputs.integration }}"

  - id: "review-readiness"
    type: gate
    message: "speckit.analyze ya fue ejecutado una vez en este run. Revise sus hallazgos antes de aprobar. Si no existen hallazgos bloqueantes, apruebe. Si existen, mantenga el workflow detenido cuando sea posible, corrija deliberadamente los artifacts correspondientes y ejecute speckit.analyze manualmente solo si decide que hace falta una nueva comprobacion."
    options:
      - "approve"
      - "reject"
    on_reject: abort

  - id: "implement"
    type: command
    command: "speckit.implement"
    integration: "{{ inputs.integration }}"

  - id: "converge"
    type: command
    command: "speckit.converge"
    integration: "{{ inputs.integration }}"

  - id: "review-convergence"
    type: gate
    message: "Revise el resultado de speckit.converge. Si informo Converged, apruebe para finalizar. Si agrego tareas, no dispare un retry automatico; rechace para abortar este run, complete las nuevas tasks mediante el flujo correspondiente y decida manualmente como continuar."
    options:
      - "approve"
      - "reject"
    on_reject: abort
