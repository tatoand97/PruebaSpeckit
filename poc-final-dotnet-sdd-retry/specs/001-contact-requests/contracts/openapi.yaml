openapi: 3.1.0
info:
  title: Contact Requests API
  version: 1.0.0
  description: >-
    Registers and retrieves synthetic or non-sensitive contact requests in a
    controlled environment. Authentication and authorization are intentionally
    outside this feature.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.contact-requests.test
    description: Controlled synthetic-data environment
security: []
tags:
  - name: Contact Requests
    description: Register and retrieve contact requests by exact identifier.
paths:
  /contact-requests:
    post:
      tags:
        - Contact Requests
      summary: Register a contact request
      description: Every valid submission creates a new resource, including duplicate content.
      operationId: createContactRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequestRequest'
      responses:
        '201':
          description: Contact request created
          headers:
            Location:
              description: Relative URI of the created contact request.
              schema:
                type: string
                example: /contact-requests/0198f4f6-36c8-7a52-a485-7d164c81c1b2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContactRequestResponse'
        '400':
          description: One or more input fields are invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Request body exceeds 8192 bytes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Identifier allocation failed after three collisions
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /contact-requests/{contactRequestId}:
    get:
      tags:
        - Contact Requests
      summary: Retrieve a contact request by its exact identifier
      description: >-
        Returns no approximate match. Unknown, incomplete, altered, or malformed
        identifiers produce the same not-found outcome.
      operationId: getContactRequestById
      parameters:
        - name: contactRequestId
          in: path
          required: true
          description: Exact identifier returned when the contact request was created.
          schema:
            type: string
          example: 0198f4f6-36c8-7a52-a485-7d164c81c1b2
      responses:
        '200':
          description: Contact request found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactRequestResponse'
        '404':
          description: No contact request exactly matches the supplied identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /health:
    get:
      tags:
        - Contact Requests
      summary: Report application and SQL Server health
      description: Returns only a safe aggregate health status.
      operationId: getHealth
      responses:
        '200':
          description: Application and required dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Application or a required dependency is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    CreateContactRequestRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - subject
        - message
      properties:
        name:
          type: string
          description: Unicode White_Space is trimmed from both ends; the normalized value must contain 1-150 Unicode scalar values.
          example: Ada Lovelace
        email:
          type: string
          minLength: 1
          maxLength: 320
          pattern: '^[\x21-\x3F\x41-\x7E]+@[^\s@.]+(\.[^\s@.]+)+$'
          description: Preserved exactly; ASCII only, no whitespace, one at-sign, and a dotted domain with non-empty labels.
          example: ada@example.test
        subject:
          type: string
          description: Unicode White_Space is trimmed from both ends; the normalized value must contain 1-200 Unicode scalar values.
          example: Product question
        message:
          type: string
          description: Unicode White_Space is trimmed from both ends; the normalized value must contain 1-2000 Unicode scalar values.
          example: This is a synthetic contact request.
    CreateContactRequestResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - createdAtUtc
      properties:
        id:
          type: string
          format: uuid
          example: 0198f4f6-36c8-7a52-a485-7d164c81c1b2
        createdAtUtc:
          type: string
          format: date-time
          example: '2026-07-29T15:30:00Z'
    ContactRequestResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - subject
        - message
        - createdAtUtc
      properties:
        id:
          type: string
          format: uuid
          example: 0198f4f6-36c8-7a52-a485-7d164c81c1b2
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Ada Lovelace
        email:
          type: string
          format: email
          minLength: 1
          example: ada@example.test
        subject:
          type: string
          minLength: 1
          maxLength: 200
          example: Product question
        message:
          type: string
          minLength: 1
          maxLength: 2000
          example: This is a synthetic contact request.
        createdAtUtc:
          type: string
          format: date-time
          example: '2026-07-29T15:30:00Z'
    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
          example: https://httpstatuses.com/404
        title:
          type: string
          example: Contact request not found
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 404
        detail:
          type: string
          example: No contact request matches the supplied identifier.
        instance:
          type: string
          format: uri-reference
          example: /contact-requests/not-an-existing-id
        traceId:
          type: string
          minLength: 1
          example: 00-f6e2bff25d9d4d4f8f706427155abb55-00f067aa0ba902b7-01
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                name:
                  - Name is required.
                email:
                  - Email must have a valid format.
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - Healthy
            - Degraded
            - Unhealthy
          example: Healthy
