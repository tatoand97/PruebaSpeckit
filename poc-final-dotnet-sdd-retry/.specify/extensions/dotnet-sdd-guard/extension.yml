schema_version: "1.0"

extension:
  id: "dotnet-sdd-guard"
  name: ".NET SDD Guard"
  version: "1.0.0"
  description: "Deterministic quality gate for mechanically verifiable dotnet-sdd controls"
  author: "Contributors"
  category: "code"
  effect: "read-write"

requires:
  speckit_version: ">=0.14.3"
  tools:
    - name: "dotnet"
      required: true
    - name: "pwsh"
      required: true
    - name: "npx"
      required: false

provides:
  commands:
    - name: "speckit.dotnet-sdd-guard.verify"
      file: "commands/speckit.dotnet-sdd-guard.verify.md"
      description: "Run the deterministic .NET SDD Guard and preserve its exit code"

hooks:
  after_implement:
    command: "speckit.dotnet-sdd-guard.verify"
    optional: false
    priority: 5
    description: "Run the mandatory deterministic quality gate after implementation"
