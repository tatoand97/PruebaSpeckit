name: OpenSpec .NET SDD Verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - chore/migrate-speckit-to-openspec

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0

      - name: Install pinned OpenSpec
        shell: pwsh
        run: npm install --global @fission-ai/openspec@1.7.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Validate OpenSpec
        shell: pwsh
        run: openspec validate --all --strict

      - name: Restore
        shell: pwsh
        run: dotnet restore PoCFinal/PoCFinal.sln

      - name: Build Release with zero warnings
        shell: pwsh
        run: dotnet build PoCFinal/PoCFinal.sln -c Release --no-restore -warnaserror

      - name: Unit tests and coverage
        shell: pwsh
        run: >-
          dotnet test
          PoCFinal/Modules/ContactRequests/Tests/ContactRequests.Test/ContactRequests.UnitTests.csproj
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory PoCFinal/TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Lint active OpenAPI contract
        shell: pwsh
        run: >-
          npx --yes @redocly/cli@2.41.1 lint
          openspec/specs/contact-requests/contracts/openapi.yaml

      - name: Run deterministic gate
        shell: pwsh
        run: ./scripts/Invoke-OpenSpecSddGuard.ps1

      - name: Test guard, harness, and installer
        shell: pwsh
        run: |
          ./tools/dotnet-sdd-guard/tests/Invoke-GuardTests.ps1
          ./tools/openspec-sdd-harness/tests/Invoke-HarnessTests.ps1
          ./distribution/openspec/dotnet-sdd/tests/Invoke-InstallerTests.ps1

      - name: Upload guard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotnet-sdd-guard-evidence
          path: PoCFinal/artifacts/sdd-guard/
          if-no-files-found: warn
