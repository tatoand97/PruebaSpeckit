name: OpenSpec .NET SDD Package Verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - chore/migrate-speckit-to-openspec

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0

      - name: Install pinned OpenSpec
        shell: pwsh
        run: npm install --global @fission-ai/openspec@1.7.0

      - name: Set up .NET 10 for guard fixtures
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Validate schema and strict OpenSpec state
        shell: pwsh
        run: |
          openspec schema validate dotnet-sdd --verbose
          openspec validate --all --strict

      - name: Test reusable guard fixtures
        shell: pwsh
        run: ./tools/dotnet-sdd-guard/tests/Invoke-GuardTests.ps1

      - name: Test installer fixtures
        shell: pwsh
        run: ./distribution/openspec/dotnet-sdd/tests/Invoke-InstallerTests.ps1

      - name: Audit secrets and local paths
        shell: pwsh
        run: |
          $pattern = @(
            ('[A-Za-z]:' + '\\Users\\'),
            ('[A-Za-z]:' + '/Users/'),
            ('file' + '://'),
            ('local' + 'host'),
            ('127' + '\.0\.0\.1'),
            ('\[' + '::1\]'),
            'ghp_[A-Za-z0-9]{20,}',
            'github_pat_[A-Za-z0-9_]{20,}'
          ) -join '|'
          & git grep -n -i -E $pattern -- ':!legacy/spec-kit/**'
          if ($LASTEXITCODE -eq 0) { throw 'Secret or local-environment audit found a match.' }
          if ($LASTEXITCODE -gt 1) { throw "Audit command failed with exit code $LASTEXITCODE." }

      - name: Audit residual application and legacy-runtime references
        shell: pwsh
        run: |
          $pattern = @(
            ('PoC' + 'Final'),
            ('Contact' + 'Requests'),
            ('contact' + '-requests'),
            ('registrar' + '-contacto'),
            ('solicitud' + ' de contacto'),
            ('HU' + '-001'),
            ('spec' + 'ify-cli'),
            ('\.' + 'spec' + 'ify'),
            ('spec' + 'kit\.')
          ) -join '|'
          & git grep -n -i -E $pattern -- ':!legacy/spec-kit/**'
          if ($LASTEXITCODE -eq 0) { throw 'Residual-reference audit found a match.' }
          if ($LASTEXITCODE -gt 1) { throw "Audit command failed with exit code $LASTEXITCODE." }

      - name: Validate reusable package
        shell: pwsh
        run: ./scripts/Test-OpenSpecDotNetSddPackage.ps1
